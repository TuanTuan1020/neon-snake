<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090f16"><meta name="apple-mobile-web-app-capable" content="yes"><title>霓蛇 · 再来一局</title>
<style>

left:90px;top:44px;opacity:.7}.hero-art i:nth-child(5){left:90px;top:14px}.hero-art i:nth-child(6){left:120px;top:14px}.hero-art i:nth-child(6):after{content:'••';position:absolute;right:2px;top:0;color:#15230a;letter-spacing:4px}.hero-art b{position:absolute;left:209px;top:20px;color:#ffb562;font-size:26px}.home-actions{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.home-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.stats{display:flex;align-items:center;gap:16px;padding:13px 0 10px}.stats div{flex:1}.stats small{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}.stats b{font-size:26px;font-variant-numeric:tabular-nums}.stats .combo b{color:var(--green);font-size:22px}.meter{height:3px;background:#233343;border-radius:4px;margin-bottom:10px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:var(--green);transition:width .08s linear}.arena{isolation:isolate;position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}canvas{display:block;border:1px solid #2b3c42;border-radius:18px;background:#0d1720;max-width:100%;max-height:100%;touch-action:none}.game-foot{flex-shrink:0;padding:12px 0 0;min-height:66px}.game-foot p{text-align:center;font-size:11px;color:var(--muted);margin-top:7px}#buffs{min-height:20px;text-align:center;font-size:11px;color:var(--green)}#notice{position:absolute;top:14px;left:12px;right:12px;text-align:center;pointer-events:none;color:var(--green);font-size:13px;line-height:1.6;text-shadow:0 2px 10px #000;transition:opacity .2s}.modal{position:fixed;inset:0;background:#050b12dc;z-index:10;display:none;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.modal.open{display:flex}.sheet{width:100%;max-width:420px;max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:16px}.sheet h2{font-size:28px;letter-spacing:-1px}.sheet>p{font-size:13px;line-height:1.7;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px;background:var(--panel);border-radius:16px}.toggle{min-width:70px;padding:10px 15px}.toggle.on{color:var(--green);border-color:#708e48}.result-score{font-variant-numeric:tabular-nums;font-size:84px;line-height:1;font-weight:800;letter-spacing:-5px;color:var(--green)}.result-details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-details div{background:var(--panel);padding:15px;border-radius:15px}.result-details small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.result-details b{font-size:22px}#cards{display:grid;gap:10px}.card{text-align:left;display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:17px;border-left:3px solid var(--rarity)}.card .icon{font-size:25px;color:var(--rarity)}.card strong{font-size:17px}.card small{float:right;color:var(--rarity);font-size:10px}.card p{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.skin{padding:14px;text-align:left}.swatch{display:block;height:14px;border-radius:8px;margin:5px 0 14px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 14px var(--a)}.skin strong{font-size:14px}.skin small{display:block;margin-top:7px;font-size:11px;color:var(--muted)}#toast{position:fixed;z-index:30;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e7f6dd;color:#17220b;padding:11px 20px;border-radius:30px;max-width:90%;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}.burst{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.12);filter:brightness(1.5)}}@media(max-height:650px){#app{padding-top:max(7px,env(safe-area-inset-top));padding-bottom:max(7px,env(safe-area-inset-bottom))}.stats{padding:4px 0}.stats b{font-size:21px}.game-foot{min-height:47px;padding-top:6px}.hero-art{height:76px;margin-top:10px}.hero h1{font-size:46px}.sheet{gap:11px}.card{padding:12px}.result-score{font-variant-numeric:tabular-nums;font-size:65px}button{padding:13px}}

/* 四个同尺寸的大方键，采用熟悉的方向键排列。 */
.game-foot{padding-top:9px;min-height:0}
#buffs{min-height:16px;line-height:1.5;margin-bottom:9px}
#controls{--key-size:94px;--key-size:clamp(84px,24vw,98px);display:grid;grid-template-columns:repeat(3,var(--key-size));grid-template-rows:repeat(2,var(--key-size));gap:10px;width:max-content;max-width:100%;margin:0 auto;touch-action:none}
.direction-key{display:flex;align-items:center;justify-content:center;padding:0;min-width:0;width:var(--key-size);height:var(--key-size);border:1px solid #344740;border-radius:24px;background:linear-gradient(155deg,#20302e,#13211f);color:#d5edd1;line-height:1;touch-action:none;-webkit-touch-callout:none;box-shadow:inset 0 1px 0 #ffffff0b,0 4px 0 #050c0b;transition:background .06s,border-color .06s,box-shadow .06s;cursor:pointer}
.direction-key svg{display:block;width:34px;height:34px;pointer-events:none}
.direction-key:active,.direction-key.pressed{background:var(--green);color:#15240f;border-color:var(--green);box-shadow:inset 0 1px 0 #ffffff30,0 2px 0 #5d9137,0 0 22px #b2ff6529;transform:none}
#keyU{grid-column:2;grid-row:1}#keyL{grid-column:1;grid-row:2}#keyD{grid-column:2;grid-row:2}#keyR{grid-column:3;grid-row:2}
#keyL svg{transform:rotate(-90deg)}#keyD svg{transform:rotate(180deg)}#keyR svg{transform:rotate(90deg)}
.game-foot #hint{font-size:10px;margin-top:10px;line-height:1.5}
@media(max-width:350px){#controls{--key-size:84px;gap:8px}.direction-key{border-radius:21px}}
@media(max-height:700px){#controls{--key-size:84px;gap:8px}.direction-key{border-radius:22px}.direction-key svg{width:32px;height:32px}.game-foot{padding-top:6px}#buffs{margin-bottom:7px}.game-foot #hint{display:none}}
@media(max-height:570px){#controls{--key-size:72px;gap:7px}.direction-key{border-radius:19px}.direction-key svg{width:30px;height:30px}}

.math-question{padding:26px 8px;text-align:center;font-size:clamp(38px,10vw,56px);font-weight:800;letter-spacing:1px;border:1px solid #34462c;border-radius:22px;background:#152018;color:var(--green);font-variant-numeric:tabular-nums}
.math-question span{color:#94b886}
.math-answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.math-answer{min-height:76px;font-size:30px;font-weight:800;border-color:#49613e}
.math-answer:active{background:var(--green);color:#14210c}
.math-answer.wrong{border-color:#a35d70;color:#ed8fa5;opacity:.45}
.sheet>.math-feedback{min-height:22px;text-align:center;color:var(--green)}
@media(max-height:650px){.math-question{padding:20px 8px}.math-answer{min-height:64px}.sheet .result-score{font-size:58px}}
</style></head><body><main id="app"><header><strong>霓蛇 <span class="muted">/ 单机</span></strong><span class="coin">◈ <b id="coins">0</b></span></header>
<section id="home" class="screen active"><div class="hero"><div class="label">指尖一划 · 再来一局</div><h1>越贪心<br>越<span>上头</span></h1><p>吃掉光点，找到你的节奏<br>下一次转弯，可能就是新纪录</p><div class="hero-art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b>✦</b></div></div><div class="home-actions"><button class="primary" id="start">开始游戏 ↗</button><div class="two"><button id="shopBtn">蛇的衣橱</button><button id="settingsBtn">设置</button></div></div><div class="home-foot"><span>本机最高 <b id="homeBest">0</b></span><span>方向键 + 滑动 · 双重操控</span></div></section>
<section id="game" class="screen"><div class="stats"><div><small>本局得分</small><b id="score">0</b></div><div><small>本机最高</small><b id="best">0</b></div><div class="combo"><small>连击倍率</small><b id="combo">×1</b></div><button id="pauseBtn" class="small" aria-label="暂停">暂停</button></div><div class="meter"><i id="comboBar"></i></div><div class="arena" id="arena"><canvas id="board" aria-label="贪吃蛇游戏棋盘"></canvas><div id="notice"></div></div><div class="game-foot"><div id="buffs">点按方向键，或自由滑动</div>
<nav id="controls" aria-label="方向控制">
<button id="keyU" class="direction-key" data-direction="U" aria-label="向上" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<button id="keyL" class="direction-key" data-direction="L" aria-label="向左" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<button id="keyD" class="direction-key" data-direction="D" aria-label="向下" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<button id="keyR" class="direction-key" data-direction="R" aria-label="向右" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</nav><p id="hint">点按即转向 · 滑动仍可用　｜　橙红 +10 · 金色 ×5 · 紫色 −20</p></div></section></main>
<div class="modal" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div><div id="toast" role="status"></div>
<script>
'use strict';
// 离线单文件：直接用支持本地 HTML 的浏览器打开。
// 手机临时测试：电脑在文件目录运行 python3 -m http.server 8000，
// 手机和电脑连同一 Wi-Fi，浏览器打开 http://电脑局域网IP:8000。
// 无外部资源或请求；存档不可用时仅保存在本次会话内。
// 所有玩法数值集中在这里；逻辑按格推进，画面按帧插值。
const CFG={
  stage:5,
  cols:16,
  rows:24,
  startLength:4,
  minLength:2,
  step:.155,
  minStep:.072,
  swipe:10,
  queue:2,
  normalScore:10,
  goldMultiplier:5,
  poisonPenalty:20,
  poisonShrink:2,
  goldLife:5,
  goldInterval:10,
  goldChance:.62,
  comboWindow:5,
  comboMax:5,
  upgradeEvery:5,
  slowFactor:.9,
  magnetRange:2,
  wallDuration:10,
  doubleDuration:15,
  slim:3,
  speedEvery:20,
  speedFactor:.96,
  staticAt:35,
  movingAt:65,
  reshuffleEvery:35,
  obstacleWarning:3,
  obstacleCount:5,
  moveEvery:.9,
  safeRadius:4,
  coinDivisor:40,
  mathMax:10,
  reviveLength:4,
  reviveSafeRadius:4,
  reviveWait:1,
  particleCount:14,
  particleLimit:100,
  floatLimit:12,
  trailAlpha:.12,
  audioVolume:.055,
  rarityWeights:{common:5,rare:3,legendary:1}
};
const $=id=>document.getElementById(id), canvas=$('board'),ctx=canvas.getContext('2d');
const DIR={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
const SKINS=[{name:'青柠电流',a:'#b2ff65',b:'#5ccf81',cost:0},{name:'冰川信号',a:'#73edff',b:'#487bff',cost:35},{name:'落日汽水',a:'#ffca6a',b:'#ff647e',cost:55},{name:'紫色脉冲',a:'#d4a4ff',b:'#8c60ff',cost:80},{name:'桃色幻影',a:'#ff99c9',b:'#f45593',cost:110},{name:'白昼微光',a:'#ffffff',b:'#8babbc',cost:150}];
let save={best:0,coins:0,unlocked:[0],skin:0,sound:false,vibration:true},storageOK=true;
// 本机存档：读取与写入失败都不阻断游戏。
function load(){try{const d=JSON.parse(localStorage.getItem('neonsnake_offline_v1')||'null');if(d&&typeof d==='object'){for(const k of ['best','coins'])if(Number.isFinite(d[k])&&d[k]>=0)save[k]=Math.floor(d[k]);if(Array.isArray(d.unlocked))save.unlocked=[...new Set([0,...d.unlocked.filter(v=>Number.isInteger(v)&&v>=0&&v<SKINS.length)])];if(save.unlocked.includes(d.skin))save.skin=d.skin;for(const k of ['sound','vibration'])if(typeof d[k]==='boolean')save[k]=d[k];}}catch(e){storageOK=false;}}
function persist(){if(CFG.stage<4)return;try{localStorage.setItem('neonsnake_offline_v1',JSON.stringify(save));}catch(e){storageOK=false;}}
let state='home',g=null,last=0,acc=0,cell=10,viewW=160,viewH=240,noticeUntil=0,toastTimer;
let particles=[],floats=[],audio=null;
const skinPalette=SKINS.map(s=>Array.from({length:64},(_,i)=>{const t=i/63,a=parseInt(s.a.slice(1),16),b=parseInt(s.b.slice(1),16);const rgb=[16,8,0].map(k=>Math.round(((a>>k)&255)*(1-t)+((b>>k)&255)*t));return 'rgb('+rgb.join(',')+')';}));
function refresh(){ $('coins').textContent=save.coins;$('homeBest').textContent=save.best;$('best').textContent=save.best;}
function showToast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,2200);}
function vibrate(ms){if(save.vibration&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
function initAudio(){if(CFG.stage<5)return;try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){audio=null;}}
function sound(type){if(CFG.stage<5||!save.sound||!audio||audio.state!=='running')return;try{const notes=type==='gold'?[660,880,1320]:type==='die'?[190,120,65]:type==='select'?[440,660,880]:type==='poison'?[220,165]:[650,920];const now=audio.currentTime;notes.forEach((f,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),t=now+i*.055;osc.type=type==='die'?'triangle':'sine';osc.frequency.setValueAtTime(f,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(CFG.audioVolume,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.13);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.14);osc.onended=()=>{osc.disconnect();gain.disconnect();};});}catch(e){}}

function notify(s,d=2){$('notice').textContent=s;noticeUntil=g?g.time+d:0;$('notice').style.opacity=1;}
function screen(name){for(const e of document.querySelectorAll('.screen'))e.classList.toggle('active',e.id===name);}
function modal(html){resetControls();$('sheet').innerHTML=html;$('overlay').classList.add('open');}
function closeModal(){$('overlay').classList.remove('open');$('sheet').innerHTML='';}
function same(a,b){return a.x===b.x&&a.y===b.y;}function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function freeCell(){for(let n=0;n<700;n++){const p={x:Math.floor(Math.random()*CFG.cols),y:Math.floor(Math.random()*CFG.rows)};if(!g.snake.some(s=>same(s,p))&&!g.obstacles.some(s=>same(s,p))&&!g.fruits.some(s=>same(s,p))&&!(g.pending||[]).some(s=>same(s,p)))return p;}for(let y=0;y<CFG.rows;y++)for(let x=0;x<CFG.cols;x++){const p={x,y};if(!g.snake.some(s=>same(s,p))&&!g.obstacles.some(s=>same(s,p))&&!g.fruits.some(s=>same(s,p))&&!(g.pending||[]).some(s=>same(s,p)))return p;}return null;}
function spawn(type){const p=freeCell();if(p)g.fruits.push({...p,type,expires:type==='gold'?g.time+CFG.goldLife:Infinity});}
function start(){initAudio();resetControls();pointer=null;closeModal();g={snake:Array.from({length:CFG.startLength},(_,i)=>({x:7-i,y:13})),prev:[],dir:DIR.R,queue:[],score:0,time:0,fruits:[],obstacles:[],pending:[],combo:0,bestCombo:1,lastFruit:-100,eaten:0,grow:0,nextUpgrade:CFG.upgradeEvery,slow:1,magnet:false,shields:0,wallUntil:0,doubleUntil:0,invUntil:0,nextGold:CFG.goldInterval,level:0,nextObstacles:CFG.staticAt,moveClock:0,goldCount:0,poisonCount:0,record:save.best,settled:false,awardedCoins:0,revives:0,resumeWait:0,reviveQuestion:null};g.prev=g.snake.map(p=>({...p}));particles=[];floats=[];spawn('normal');if(CFG.stage>=2)spawn('poison');state='playing';acc=0;last=performance.now();screen('game');resize();hud();notify('点按方向键，或轻划转弯',3);}
function enqueue(d){if(state!=='playing'||g.queue.length>=CFG.queue)return false;const prior=g.queue[g.queue.length-1]||g.dir;if((d.x===-prior.x&&d.y===-prior.y)||same(d,prior))return false;g.queue.push(d);return true;}
function interval(){return Math.max(CFG.minStep,CFG.step*g.slow*Math.pow(CFG.speedFactor,g.level));}
function die(){
  if(state!=='playing'&&state!=='paused')return;
  state='dead';pointer=null;g.queue=[];
  vibrate([70,40,140]);sound('die');settle();
}
function settle(){
  if(g.settled)return;
  g.settled=true;
  // 同一局复活只补发新增金币，避免多次死亡重复领取。
  const total=CFG.stage>=4?Math.floor(g.score/CFG.coinDivisor):0;
  const added=Math.max(0,total-g.awardedCoins);
  g.awardedCoins+=added;
  if(CFG.stage>=4){save.coins+=added;save.best=Math.max(save.best,g.score);persist();}
  refresh();showResult();
}
function showResult(){
  const record=g.score>g.record;
  modal(`<div class="label">${record?'新纪录 · 漂亮的一局':'这一局，还能继续'}</div><h2>${record?'✦ 超越自己':'再给自己一次机会'}</h2><div class="result-score ${record?'burst':''}">${g.score}</div><div class="result-details"><div><small>最佳连击</small><b>×${g.bestCombo}</b></div><div><small>本局累计金币</small><b>+${g.awardedCoins}</b></div></div><p>${record?'新的标杆已经留下':`再 ${Math.max(1,save.best-g.score+1)} 分就破纪录！`}<br>答对一道 ${CFG.mathMax} 以内加减法，就能复活继续</p><button class="primary" id="reviveBtn">答题复活 ↗</button><div class="two"><button id="again">重新开始</button><button id="backHome">返回首页</button></div>`);
  $('reviveBtn').onclick=beginReviveQuiz;$('again').onclick=start;$('backHome').onclick=home;
}
function makeReviveQuestion(){
  const a=1+Math.floor(Math.random()*CFG.mathMax),plus=Math.random()<.5;
  const b=Math.floor(Math.random()*((plus?CFG.mathMax-a:a)+1));
  const answer=plus?a+b:a-b,options=Array.from({length:CFG.mathMax+1},(_,i)=>i).filter(n=>n!==answer);
  // 题目、结果与三个选项都在 0～10 内，减法不出现负数。

let pointer=null;document.addEventListener('pointerdown',e=>{initAudio();if(state!=='playing'||e.target.closest('button,.modal,#controls')||!e.isPrimary)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};});document.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||state!=='playing')return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.max(Math.abs(dx),Math.abs(dy))<CFG.swipe)return;enqueue(Math.abs(dx)>Math.abs(dy)?(dx>0?DIR.R:DIR.L):(dy>0?DIR.D:DIR.U));pointer.x=e.clientX;pointer.y=e.clientY;e.preventDefault();},{passive:false});for(const ev of ['pointerup','pointercancel'])document.addEventListener(ev,()=>pointer=null);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('keydown',e=>{const map={ArrowUp:DIR.U,ArrowDown:DIR.D,ArrowLeft:DIR.L,ArrowRight:DIR.R,w:DIR.U,s:DIR.D,a:DIR.L,d:DIR.R};if(map[e.key]){e.preventDefault();if(!e.repeat)enqueue(map[e.key]);}if((e.key==='Escape'||e.code==='Space')&&!e.target.closest('.direction-key')){e.preventDefault();if(state==='playing')pause();else if(state==='paused')$('resume')?.click();}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);window.addEventListener('resize',resize);
function settings(){modal(`<div class="label">按照你的节奏</div><h2>设置</h2><div class="row"><span>音效</span><button class="toggle ${save.sound?'on':''}" id="soundToggle">${save.sound?'已开启':'已关闭'}</button></div><div class="row"><span>震动</span><button class="toggle ${save.vibration?'on':''}" id="vibToggle">${save.vibration?'已开启':'已关闭'}</button></div><p>震动仅在支持的设备与浏览器生效<br>${storageOK?'进度保存在当前浏览器，本机使用':'当前浏览器无法存档，仍可正常游玩'}</p><button id="close">完成</button>`);$('soundToggle').onclick=()=>{save.sound=!save.sound;initAudio();persist();settings();sound('select');};$('vibToggle').onclick=()=>{save.vibration=!save.vibration;persist();settings();vibrate(15);};$('close').onclick=closeModal;}
function shop(){modal(`<div class="label">换一种颜色，再出发</div><h2>蛇的衣橱 <span class="coin" style="font-size:17px">◈ ${save.coins}</span></h2><p>皮肤只改变外观，不影响难度</p><div class="shop-grid" id="skins"></div><button id="shopClose">返回首页</button>`);for(const [i,skin] of SKINS.entries()){const owned=save.unlocked.includes(i),b=document.createElement('button');b.className='skin';b.style.setProperty('--a',skin.a);b.style.setProperty('--b',skin.b);b.innerHTML=`<span class="swatch"></span><strong>${skin.name}</strong><small>${save.skin===i?'✓ 正在使用':owned?'已解锁 · 点击穿上':'◈ '+skin.cost+' 金币解锁'}</small>`;b.onclick=()=>{initAudio();if(!owned){if(save.coins<skin.cost){showToast('还差 '+(skin.cost-save.coins)+' 金币');return;}save.coins-=skin.cost;save.unlocked.push(i);}save.skin=i;persist();refresh();sound('select');shop();};$('skins').appendChild(b);}$('shopClose').onclick=closeModal;}
$('start').onclick=start;$('pauseBtn').onclick=pause;$('shopBtn').onclick=shop;$('settingsBtn').onclick=settings;
if(CFG.stage>=4)load();refresh();requestAnimationFrame(frame);
</script></body></html>
